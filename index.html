<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="icon" href="data:,">
<title>Lane Clash</title>

<style>
html,body{margin:0;padding:0;height:100%;background:#0b0f1e;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
</style>

<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=400;let H=760,scale=1,dpr=1;
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,3);
  scale=vw/W;H=Math.max(560,vh/scale);
  if(H*scale>vh){scale=vh/H;}
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
}
window.addEventListener('resize',resize);resize();
function offX(){return (window.innerWidth-W*scale)/2;}

try{
  const ic=document.createElement('canvas');ic.width=ic.height=192;const g=ic.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,192);gr.addColorStop(0,'#1d2b64');gr.addColorStop(1,'#0b0f1e');
  g.fillStyle=gr;g.fillRect(0,0,192,192);
  g.fillStyle='#2ecc71';g.fillRect(16,16,76,160);g.fillStyle='#e74c3c';g.fillRect(100,16,76,160);
  g.fillStyle='#fff';g.beginPath();g.moveTo(96,120);g.lineTo(76,165);g.lineTo(116,165);g.closePath();g.fill();
  g.font='bold 40px sans-serif';g.textAlign='center';g.fillText('+',54,80);g.fillText('☠',138,80);
  const url=ic.toDataURL('image/png');
  document.getElementById('appleIcon').href=url;
  const man={name:'Lane Clash',short_name:'Lane Clash',display:'standalone',orientation:'portrait',background_color:'#0b0f1e',theme_color:'#0b0f1e',start_url:location.href.split('#')[0],icons:[{src:url,sizes:'192x192',type:'image/png'}]};
  document.getElementById('manifestLink').href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
}catch(e){}

const rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1)), clamp=(v,a,b)=>v<a?a:v>b?b:v;

// Normal is the live game with a busier horde. Hard and Crazy step up from that.
const MODES={
  normal:{id:'normal',label:'Normal',banner:'NORMAL',color:'#51cf66',hint:'More enemies than the original',
    count:1.5,gap:0.8,gapFloor:0.22,delay:1.25,doubleAfter:2,doubleP:0.32,
    hp:1,speed:1,dmg:1,bigAdd:0,bossHp:1,bossSp:1,bossDmg:1,
    multiFrom:4,powerFrom:3,powerP:0.12},
  hard:{id:'hard',label:'Hard',banner:'HARD',color:'#fcc419',hint:'Denser, faster, tougher horde',
    count:1.9,gap:0.66,gapFloor:0.18,delay:1.05,doubleAfter:1,doubleP:0.4,
    hp:1.28,speed:1.12,dmg:1.25,bigAdd:0.05,bossHp:1.4,bossSp:1.12,bossDmg:1.3,
    multiFrom:5,powerFrom:4,powerP:0.1},
  crazy:{id:'crazy',label:'Crazy',banner:'CRAZY',color:'#ff6b6b',hint:'Relentless packs and heavy bosses',
    count:2.05,gap:0.62,gapFloor:0.16,delay:0.95,doubleAfter:1,doubleP:0.48,
    hp:1.55,speed:1.2,dmg:1.5,bigAdd:0.1,bossHp:1.75,bossSp:1.22,bossDmg:1.55,
    multiFrom:6,powerFrom:5,powerP:0.1}
};
const MODE_ORDER=['normal','hard','crazy'];
const BEST_KEYS={normal:'laneClashBest',hard:'laneClashBestHard',crazy:'laneClashBestCrazy'};
const POWERS=[
  {id:'pierce',name:'PIERCE',mark:'P',color:'#74c0fc',weight:3,cap:4},
  {id:'ricochet',name:'RICOCHET',mark:'R',color:'#da77f2',weight:3,cap:3},
  {id:'split',name:'SPLIT',mark:'S',color:'#ffd43b',weight:3,cap:2},
  {id:'rage',name:'RAGE',mark:'A',color:'#ff6b6b',weight:3,cap:3},
  {id:'shield',name:'SHIELD',mark:'O',color:'#66d9e8',weight:3,cap:3},
  {id:'slow',name:'SLOW',mark:'W',color:'#a5d8ff',weight:3,cap:3},
  {id:'blood',name:'BLOOD',mark:'B',color:'#ff8787',weight:3,cap:4},
  {id:'magnet',name:'MAGNET',mark:'M',color:'#ffd8a8',weight:3,cap:3},
  {id:'charge',name:'CHARGE',mark:'C',color:'#ffe066',weight:2,cap:3},
  {id:'empower',name:'EMPOWER',mark:'E',color:'#b2f2bb',weight:3,cap:3},
  {id:'overdrive',name:'OVERDRIVE',mark:'D',color:'#ffa94d',weight:1,cap:0},
  {id:'revive',name:'REVIVE',mark:'V',color:'#ffd43b',weight:1,cap:0}
];
function powerMeta(id){for(const p of POWERS) if(p.id===id) return p; return POWERS[0];}
function modeBy(id){return MODES[id]||MODES.normal;}
const bests={normal:0,hard:0,crazy:0};
let selected='normal';
function loadMeta(){
  try{
    for(const id of MODE_ORDER){const n=+localStorage.getItem(BEST_KEYS[id])||0; bests[id]=n>0?n:0;}
    const saved=localStorage.getItem('laneClashDifficulty');
    if(MODES[saved]) selected=saved;
  }catch(e){}
}
function saveBest(id){try{localStorage.setItem(BEST_KEYS[id], String(bests[id]));}catch(e){}}
function saveSelected(){try{localStorage.setItem('laneClashDifficulty', selected);}catch(e){}}
loadMeta();
function bestFor(id){return bests[id]||0;}
function setDifficulty(id){
  if(!MODES[id]||state==='play') return false;
  selected=id; saveSelected(); return true;
}
function oldCount(w){return 6+Math.floor(w*2.5);}
function hordeBudget(m,w){return Math.max(1, Math.round(oldCount(w)*m.count));}
function spawnGap(m,w){return Math.max(m.gapFloor, Math.max(0.28,1.1-w*0.05)*m.gap);}

let AC=null;
function beep(f,d,type,vol){if(!AC)return;try{const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'square';o.frequency.value=f;gn.gain.value=vol||0.03;gn.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}

const LANE_W=W/2;
let state='menu',G=null,shake=0,flash=0,t=0,eid=1;
function laneCenter(i){return LANE_W*i+LANE_W/2;}
function freshPowers(){return {pierce:0,ricochet:0,split:0,rage:0,shield:0,slow:0,blood:0,magnet:0,charge:0,empower:0,overT:0,revive:false,reviveUsed:false};}
function newGame(){
  const diffId=selected,m=modeBy(diffId);
  G={hp:100,maxHp:100,score:0,kills:0,wave:0,
     rate:3,dmg:1,multi:1,squad:0,
     px:laneCenter(0),tx:laneCenter(0),
     upLane:0,
     bullets:[],enemies:[],gates:[],parts:[],texts:[],
     fireT:0,gateT:1.2,spawnLeft:0,spawnT:0,waveT:0,bannerT:0,banner:'',bannerSub:'',
     bossAlive:false,over:false,diffId,
     powers:freshPowers(),shieldOn:0,shieldCd:3.2,chargeCd:2.6,collected:0};
  startWave();
}
function hordeLane(){return 1-G.upLane;}
function startWave(){
  const m=modeBy(G.diffId);
  G.wave++;
  const w=G.wave;
  let sub='';
  if(w>1&&w%3===1){G.upLane=1-G.upLane;sub='LANES SWAPPED!';beep(300,0.4,'sawtooth',0.04);}
  G.spawnLeft=hordeBudget(m,w);
  G.spawnT=m.delay;
  if(w%5===0){spawnBoss();sub='⚠ BOSS INCOMING ⚠';G.spawnLeft=Math.max(1,Math.floor(G.spawnLeft*0.5));}
  if(!sub) sub=m.banner;
  G.banner='WAVE '+w;G.bannerSub=sub;G.bannerT=2.2;
}
function spawnEnemy(){
  const m=modeBy(G.diffId),w=G.wave,l=hordeLane();
  const big=Math.random()<Math.min(0.08+w*0.02+m.bigAdd,0.55);
  const hp=Math.max(1,Math.round((1+w*1.1)*Math.pow(1.16,w)*(big?3.5:1)*(0.8+Math.random()*0.4)*m.hp));
  G.enemies.push({id:++eid,x:laneCenter(l)+rand(-LANE_W/2+22,LANE_W/2-22),y:-20,r:big?19:12,hp,maxHp:hp,
    sp:((big?40:58)+w*3+rand(0,15))*m.speed,dmg:Math.max(1,Math.round((big?14:6)*m.dmg)),
    fl:0,boss:false,wob:rand(0,6),pts:big?30:10,slowT:0,slowMul:1});
}
function spawnBoss(){
  const m=modeBy(G.diffId),w=G.wave,l=hordeLane();
  const hp=Math.max(1,Math.round((55*w+w*w*6)*Math.pow(1.1,w)*m.bossHp));
  G.enemies.push({id:++eid,x:laneCenter(l),y:-60,r:42,hp,maxHp:hp,sp:(22+w*0.8)*m.bossSp,dmg:Math.max(1,Math.round(60*m.bossDmg)),fl:0,boss:true,wob:0,pts:500+w*50,slowT:0,slowMul:1});
  G.bossAlive=true;
}
const GATE_TYPES=[
  {k:'rate',label:v=>(v>=0?'+':'')+v+' FIRE RATE',max:5},
  {k:'dmg',label:v=>(v>=0?'+':'')+v+' DAMAGE',max:4},
  {k:'multi',label:v=>(v>=0?'+':'')+v+' MULTISHOT',max:2},
  {k:'squad',label:v=>(v>=0?'+':'')+v+' SQUAD',max:3},
  {k:'heal',label:v=>(v>=0?'+':'')+(v*10)+' HP',max:5},
];
function powerAvailable(p){
  if(!G) return true;
  if(p.id==='revive'&&(G.powers.reviveUsed||G.powers.revive)) return false;
  if(p.cap&&(G.powers[p.id]||0)>=p.cap) return false;
  return true;
}
function pickPowerId(){
  const pool=[];
  for(const p of POWERS){if(!powerAvailable(p)) continue; for(let i=0;i<p.weight;i++) pool.push(p.id);}
  if(!pool.length) return null;
  return pool[randi(0,pool.length-1)];
}
function spawnGate(){
  const w=G.wave;
  const m=modeBy(G.diffId);
  // Multishot and purple gates wait until these waves, then purple gates roll less often.
  if(w>=m.powerFrom&&Math.random()<m.powerP){
    const id=pickPowerId();
    if(id){
      const meta=powerMeta(id);
      G.gates.push({x:laneCenter(G.upLane),y:-40,w:LANE_W-24,h:52,
        type:{k:'power',label:()=>meta.name,max:1},power:id,v:1,prog:0,need:4,
        sp:85+w*2,fl:0,lane:G.upLane,shot:false});
      return;
    }
  }
  let type=GATE_TYPES[randi(0,GATE_TYPES.length-1)];
  if(w<m.multiFrom&&type.k==='multi'){
    const rest=GATE_TYPES.filter(t=>t.k!=='multi');
    type=rest[randi(0,rest.length-1)];
  }
  if(G.multi>=7&&type.k==='multi') type=GATE_TYPES[0];
  if(G.squad>=10&&type.k==='squad') type=GATE_TYPES[1];
  const risky=Math.random()<Math.min(0.25+w*0.03,0.55);
  const v=risky?-randi(1,type.k==='heal'?3:2):randi(1,type.k==='heal'?3:2);
  const need=Math.round(5+w*1.5);
  G.gates.push({x:laneCenter(G.upLane),y:-40,w:LANE_W-24,h:52,type,v,prog:0,need,sp:85+w*2,fl:0,lane:G.upLane,shot:false});
}
function suffer(amount){
  if(!G||state!=='play') return;
  if(G.shieldOn>0) return;
  G.hp-=amount;
  if(G.hp<=0){
    if(G.powers.revive&&!G.powers.reviveUsed){
      G.powers.revive=false; G.powers.reviveUsed=true;
      G.hp=Math.round(G.maxHp*0.4); G.shieldOn=1.5;
      addText(W/2,H*0.45,'SECOND WIND','#ffd43b',28);
      shake=14; beep(520,0.35,'triangle',0.06);
      return;
    }
    G.hp=0; gameOver();
  }
}
function applyPower(g){
  const id=g.power, meta=powerMeta(id);
  const boost=(g.shot&&G.powers.empower>0)?1:0;
  if(id==='overdrive'){
    G.powers.overT=Math.min(8,(G.powers.overT||0)+5.5+boost*1.5);
    addText(g.x,g.y,'OVERDRIVE','#ffa94d',22);
  }else if(id==='revive'){
    if(!G.powers.reviveUsed&&!G.powers.revive){G.powers.revive=true; addText(g.x,g.y,'SECOND WIND','#ffd43b',22);}
    else{G.hp=clamp(G.hp+12,0,G.maxHp); addText(g.x,g.y,'+12 HP','#ffd43b',20);}
  }else{
    const add=1+boost;
    G.powers[id]=Math.min(meta.cap,(G.powers[id]||0)+add);
    if(id==='shield'&&G.shieldCd>4) G.shieldCd=3;
    addText(g.x,g.y,meta.name,meta.color,22);
  }
  burst(g.x,g.y,'#b197fc',26,240); beep(740,0.16,'triangle',0.05); G.collected++;
}
function applyGate(g){
  if(g.power){applyPower(g); return;}
  let v=g.v;
  if(G.powers.empower>0&&g.shot){
    if(v>0) v=Math.min(g.type.max,v+G.powers.empower);
    else if(v<0) v=Math.min(0,v+G.powers.empower);
  }
  const k=g.type.k;
  if(v!==0){
    if(k==='rate') G.rate=clamp(G.rate+v*0.8,1,22);
    if(k==='dmg') G.dmg=clamp(G.dmg+v,1,50);
    if(k==='multi') G.multi=clamp(G.multi+v,1,7);
    if(k==='squad') G.squad=clamp(G.squad+v,0,10);
    if(k==='heal'){if(v>0) G.hp=clamp(G.hp+v*10,0,G.maxHp); else suffer(-v*10);}
  }
  const good=v>=0;
  addText(g.x,g.y,v===0?'NULLIFIED':g.type.label(v),good?'#7dffb0':'#ff6b6b',22);
  burst(g.x,g.y,good?'#2ecc71':'#e74c3c',22,220);
  if(good) beep(660,0.15,'triangle',0.05); else {beep(140,0.3,'sawtooth',0.05); shake=8;}
  G.collected++;
}
function shooters(){
  const arr=[{x:G.px,y:pY()}];
  for(let i=0;i<G.squad;i++){
    const ring=Math.floor(i/2)+1,side=i%2?1:-1;
    arr.push({x:G.px+side*ring*20,y:pY()+12+((ring%2)*8)});
  }
  return arr;
}
function pY(){return H-110;}
function rateNow(){return G.rate*((G.powers.overT||0)>0?2:1);}
function shotDamage(){
  let d=G.dmg;
  if(G.powers.rage>0) d*=1+G.powers.rage*0.55*(1-G.hp/G.maxHp);
  return d;
}
function makeBullet(x,y,vx,vy,opts){
  const charge=!!(opts&&opts.charge);
  const base=shotDamage();
  return {x,y,vx,vy,d:charge?base*(8+G.powers.charge*3):base,
    pierce:charge?6:G.powers.pierce,ricochet:charge?0:G.powers.ricochet,
    seen:{},charge,split:!!(opts&&opts.split),r:charge?12:3};
}
function fire(){
  const ss=shooters(),m=G.multi,p=G.powers;
  for(const s of ss){
    for(let j=0;j<m;j++){
      const off=(j-(m-1)/2);
      G.bullets.push(makeBullet(s.x+off*5,s.y-14,off*38,-720));
    }
    if(p.split>0){
      const dir=s.x<LANE_W?1:-1;
      for(let k=0;k<p.split;k++) G.bullets.push(makeBullet(s.x,s.y-14,dir*(150+k*50),-660,{split:true}));
    }
  }
  if(Math.random()<0.3) beep(900+Math.random()*200,0.04,'square',0.012);
}
function fireCharge(){
  const s=shooters()[0];
  G.bullets.push(makeBullet(s.x,s.y-18,0,-540,{charge:true}));
  beep(180,0.18,'sawtooth',0.04);
}
function burst(x,y,c,n,sp){if(G.parts.length>600)n=Math.min(n,4);for(let i=0;i<n;i++){const a=rand(0,6.283),s=rand(sp*0.2,sp);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.3,0.7),c,r:rand(1.5,3.5)});}}
function addText(x,y,s,c,sz){if(G.texts.length>80)G.texts.shift();G.texts.push({x,y,s,c,sz:sz||16,life:1});}
function killEnemy(e){
  if(e.dead) return;
  e.dead=true; G.kills++; G.score+=e.pts;
  burst(e.x,e.y,e.boss?'#ffcc00':'#ff7a45',e.boss?80:12,e.boss?400:200);
  addText(e.x,e.y,'+'+e.pts,e.boss?'#ffe066':'#ffd8a8',e.boss?28:14);
  beep(e.boss?200:420,e.boss?0.6:0.06,'square',0.03);
  if(G.powers.blood>0){
    const heal=(e.boss?4:2)*G.powers.blood;
    G.hp=clamp(G.hp+heal,0,G.maxHp);
    addText(e.x,e.y-16,'+'+heal,'#ff8787',14);
  }
  if(e.boss){G.bossAlive=false;shake=16;G.hp=clamp(G.hp+25,0,G.maxHp);addText(W/2,H/2,'BOSS DOWN! +25 HP','#7dffb0',26);}
}
function hurtEnemy(e,b){
  e.hp-=b.d; e.fl=1;
  if(G.powers.slow>0){
    e.slowT=Math.max(e.slowT||0,0.85+G.powers.slow*0.3);
    e.slowMul=Math.max(0.32,0.7-G.powers.slow*0.08);
  }
  if(Math.random()<0.4) G.parts.push({x:b.x,y:b.y,vx:rand(-80,80),vy:rand(-40,60),life:0.25,c:'#fff',r:2});
  if(e.hp<=0) killEnemy(e);
}
function nearestOther(b,from){
  let best=null,bestD=170*170;
  for(const e of G.enemies){
    if(e.dead||e.id===from.id||b.seen[e.id]) continue;
    const dx=e.x-from.x,dy=e.y-from.y,d=dx*dx+dy*dy;
    if(d<bestD){bestD=d; best=e;}
  }
  return best;
}
function gameOver(){
  if(state!=='play') return;
  state='over'; G.over=true; overT=0;
  const id=G.diffId;
  if(G.score>bests[id]){bests[id]=G.score; saveBest(id); G.newBest=true;}
  burst(G.px,pY(),'#ffcc00',60,350); shake=18; beep(90,0.8,'sawtooth',0.06);
}
let overT=0;

function update(dt){
  t+=dt;
  if(shake>0) shake=Math.max(0,shake-dt*40);
  if(flash>0) flash=Math.max(0,flash-dt*3);
  if(!G) return;
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy*=0.94;p.life-=dt;}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const tx of G.texts){tx.y-=40*dt;tx.life-=dt*0.9;}
  G.texts=G.texts.filter(x=>x.life>0);
  if(state!=='play'){overT+=dt; return;}
  const m=modeBy(G.diffId);
  if(G.powers.overT>0) G.powers.overT=Math.max(0,G.powers.overT-dt);
  if(G.powers.shield>0){
    if(G.shieldOn>0) G.shieldOn-=dt;
    else{
      G.shieldCd-=dt;
      if(G.shieldCd<=0){
        G.shieldOn=Math.min(2.1,0.85+G.powers.shield*0.28);
        G.shieldCd=Math.max(4,8.2-(G.powers.shield-1)*1.2);
      }
    }
  }
  if(G.powers.charge>0){
    G.chargeCd-=dt;
    if(G.chargeCd<=0){fireCharge(); G.chargeCd=Math.max(3.4,7.2-G.powers.charge*1.15);}
  }
  if(keys.left) G.tx-=420*dt; if(keys.right) G.tx+=420*dt;
  G.tx=clamp(G.tx,18,W-18);
  G.px+=(G.tx-G.px)*Math.min(1,dt*14);
  G.fireT-=dt;
  if(G.fireT<=0){fire(); G.fireT+=1/Math.max(0.2,rateNow()); if(G.fireT<0) G.fireT=0;}
  for(const b of G.bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;}
  if(G.bannerT>0) G.bannerT-=dt;
  G.spawnT-=dt;
  if(G.spawnLeft>0&&G.spawnT<=0){
    spawnEnemy(); G.spawnLeft--;
    G.spawnT=spawnGap(m,G.wave)*rand(0.6,1.3);
    if(G.wave>m.doubleAfter&&Math.random()<m.doubleP&&G.spawnLeft>0){spawnEnemy(); G.spawnLeft--;}
  }
  G.gateT-=dt;
  if(G.gateT<=0){spawnGate(); G.gateT=rand(2.0,2.8);}
  const line=pY()+10;
  for(const e of G.enemies){
    const sm=e.slowT>0?(e.slowMul||1):1;
    e.y+=e.sp*sm*dt; e.wob+=dt*4; e.x+=Math.sin(e.wob)*(e.boss?10:18)*dt;
    if(e.slowT>0){e.slowT-=dt; if(e.slowT<=0) e.slowMul=1;}
    const l=e.x<LANE_W?0:1; e.x=clamp(e.x,l*LANE_W+e.r,(l+1)*LANE_W-e.r);
    if(e.fl>0) e.fl-=dt*6;
    if(e.y+e.r>=line){
      e.dead=true;
      if(G.shieldOn>0){addText(e.x,line-20,'BLOCKED','#66d9e8',16); if(e.boss) G.bossAlive=false; continue;}
      const dealt=e.dmg;
      shake=Math.max(shake,e.boss?20:6); flash=Math.max(flash,e.boss?1:0.5);
      burst(e.x,line,'#ff3355',e.boss?60:14,260);
      addText(e.x,line-20,'-'+dealt+' HP','#ff4d6d',20);
      beep(110,0.2,'sawtooth',0.05);
      if(e.boss) G.bossAlive=false;
      suffer(dealt);
    }
  }
  const mag=G.powers.magnet||0;
  for(const g of G.gates){
    g.y+=g.sp*dt; if(g.fl>0) g.fl-=dt*6;
    if(mag&&!g.done&&g.y<pY()&&pY()-g.y<220&&Math.abs(G.px-g.x)<150){
      g.x+= (G.px-g.x)*dt*(0.7+mag*0.45);
      g.x=clamp(g.x,g.lane*LANE_W+20,(g.lane+1)*LANE_W-20);
    }
    const extra=mag*36, yTop=14+mag*16, yBot=10+mag*10;
    if(!g.done&&g.y+g.h/2>=pY()-yTop&&g.y-g.h/2<=pY()+yBot){
      if(Math.abs(G.px-g.x)<g.w/2+6+extra){g.done=true; applyGate(g);}
    }
    if(g.y-g.h/2>H) g.done=true;
  }
  for(const b of G.bullets){
    if(b.dead) continue;
    for(const e of G.enemies){
      if(e.dead||b.seen[e.id]) continue;
      const rad=e.r+(b.charge?b.r:3);
      const dx=b.x-e.x,dy=b.y-e.y;
      if(dx*dx+dy*dy>rad*rad) continue;
      b.seen[e.id]=1;
      hurtEnemy(e,b);
      if(b.pierce>0){b.pierce--; break;}
      if(b.ricochet>0){
        const nxt=nearestOther(b,e);
        if(nxt){
          const ddx=nxt.x-b.x,ddy=nxt.y-b.y,len=Math.hypot(ddx,ddy)||1;
          b.vx=ddx/len*680; b.vy=ddy/len*680; b.ricochet--; break;
        }
      }
      b.dead=true; break;
    }
    if(b.dead) continue;
    for(const g of G.gates){
      if(g.done) continue;
      if(Math.abs(b.x-g.x)<g.w/2&&Math.abs(b.y-g.y)<g.h/2){
        b.dead=true; g.fl=1; g.shot=true;
        if(g.power){g.prog=g.need; break;}
        if(g.v<g.type.max){g.prog+=1;
          if(g.prog>=g.need){g.prog=0;g.v+=1;if(G.texts.length<60) addText(g.x+rand(-30,30),g.y-20,'+1','#9fffc9',14); beep(1200,0.05,'triangle',0.02);}}
        else g.prog=g.need;
        break;
      }
    }
  }
  G.bullets=G.bullets.filter(b=>!b.dead&&b.y>-40&&b.x>-40&&b.x<W+40);
  G.enemies=G.enemies.filter(e=>!e.dead);
  G.gates=G.gates.filter(g=>!g.done);
  if(G.spawnLeft<=0&&G.enemies.length===0&&state==='play'){G.score+=G.wave*25; startWave();}
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

    const isUp=l===up;

    ctx.strokeStyle=G.shieldOn>0?'rgba(102,217,232,0.85)':'rgba(255,80,100,0.35)';
    ctx.setLineDash([8,8]); ctx.beginPath(); ctx.moveTo(0,pY()+10); ctx.lineTo(W,pY()+10); ctx.stroke(); ctx.setLineDash([]);

function activeChips(){
  const p=G.powers,out=[];

  if(p.split) out.push({t:'SPLIT '+p.split,c:'#ffd43b'});
  if(p.rage) out.push({t:'RAGE '+p.rage,c:'#ff6b6b'});
  if(p.shield) out.push({t:G.shieldOn>0?'SHIELD':'PULSE '+p.shield,c:'#66d9e8'});
  if(p.slow) out.push({t:'SLOW '+p.slow,c:'#a5d8ff'});
  if(p.blood) out.push({t:'BLOOD '+p.blood,c:'#ff8787'});

  if(p.empower) out.push({t:'EMPOWER '+p.empower,c:'#b2f2bb'});

}
function drawChips(){
  const chips=activeChips();

  ctx.font='bold 11px system-ui,sans-serif'; ctx.textBaseline='middle'; ctx.textAlign='left';

    if(x+w>maxW){x=8; y+=h+gap;}
    ctx.fillStyle='rgba(0,0,0,0.55)'; rr(x,y,w,h,8); ctx.fill();
    ctx.strokeStyle=c.c; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle=c.c; ctx.fillText(c.t,x+padX,y+h/2+0.5);
    x+=w+gap;

function center(s,y,sz,c,weight){ctx.font=(weight||'bold')+' '+sz+'px system-ui,sans-serif'; ctx.fillStyle=c||'#fff'; ctx.textAlign='center'; ctx.fillText(s,W/2,y);}
function render(){
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#0b0f1e'; ctx.fillRect(0,0,cv.width,cv.height);
  const sx=shake?rand(-shake,shake)*0.5:0,sy=shake?rand(-shake,shake)*0.5:0;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,(offX()+sx*scale)*dpr,sy*scale*dpr);
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();
  drawBG();
  if(G){
    for(const g of G.gates) drawGate(g);
    for(const e of G.enemies) drawEnemy(e);
    for(const b of G.bullets){
      if(b.charge){ctx.fillStyle='#ffe066'; ctx.beginPath(); ctx.arc(b.x,b.y,9,0,6.283); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();}

    }
    if(state!=='over'){
      const ss=shooters();
      for(let i=ss.length-1;i>=0;i--) drawSoldier(ss[i].x,ss[i].y,i===0);
      if(G.shieldOn>0){
        ctx.strokeStyle='rgba(102,217,232,0.95)'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.arc(G.px,pY(),28+4*Math.sin(t*8),0,6.283); ctx.stroke();

    }
    for(const p of G.parts){ctx.globalAlpha=Math.max(0,p.life*1.6); ctx.fillStyle=p.c; ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);}
    ctx.globalAlpha=1;
    for(const tx of G.texts){ctx.globalAlpha=Math.max(0,Math.min(1,tx.life*1.5)); ctx.font='bold '+tx.sz+'px system-ui,sans-serif'; ctx.textAlign='center'; ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.strokeText(tx.s,tx.x,tx.y); ctx.fillStyle=tx.c; ctx.fillText(tx.s,tx.x,tx.y);}
    ctx.globalAlpha=1;
    drawHUD();
    if(G.bannerT>0&&state==='play'){
      const a=Math.min(1,G.bannerT*2); ctx.globalAlpha=a;
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,H*0.32,W,G.bannerSub?90:60);

      if(G.bannerSub) center(G.bannerSub,H*0.32+74,18,G.bannerSub.includes('BOSS')?'#ff8787':'#ffe066');
      ctx.globalAlpha=1;
    }
  }
  if(flash>0){ctx.fillStyle='rgba(255,0,40,'+(flash*0.25)+')'; ctx.fillRect(0,0,W,H);}
  if(state==='menu') drawMenu();
  if(state==='over') drawOver();
  ctx.restore();
}
function chromeGeom(){

  const howTop=titleY+96;
  const howRoom=Math.max(0,labelY-28-howTop);
  const howLH=Math.min(22,Math.max(15,howRoom/7));
  return {btnW,btnH,gap,x0,bestY,startY,hintY,btnY,labelY,titleY,howTop,howLH};
}

const keys={left:false,right:false};
function toGame(cx,cy){return {x:(cx-offX())/scale,y:cy/scale};}
function hitDifficulty(x,y){
  if(state==='play') return null;
  const pad=3;
  for(const b of buttonRects()){
    if(x>=b.x-pad&&x<=b.x+b.w+pad&&y>=b.y-pad&&y<=b.y+b.h+pad) return b.id;
  }
  return null;
}
let drag=null,pressId=null;
function onDown(cx,cy){
  initAudio(); if(AC&&AC.state==='suspended') AC.resume();
  const p=toGame(cx,cy);
  const hit=hitDifficulty(p.x,p.y);
  if(hit){pressId=hit; drag=null; return;}
  pressId=null;
  if(state==='menu'){state='play'; newGame(); return;}
  if(state==='over'){if(overT>0.8){state='play'; newGame();} return;}
  drag={x0:cx,gx0:G.tx,moved:false,t0:performance.now()};
}
function onMove(cx){
  if(!drag||state!=='play') return;
  const dx=(cx-drag.x0)/scale;
  if(Math.abs(dx)>6) drag.moved=true;
  if(drag.moved) G.tx=clamp(drag.gx0+dx*1.4,18,W-18);
}
function onUp(cx,cy){
  if(pressId){
    const p=toGame(cx,cy);
    const hit=hitDifficulty(p.x,p.y);
    if(hit===pressId) setDifficulty(hit);
    pressId=null; drag=null; return;
  }
  if(!drag||state!=='play'){drag=null; return;}
  if(!drag.moved){const gx=toGame(cx,0).x; G.tx=laneCenter(gx<LANE_W?0:1);}
  drag=null;
}
cv.addEventListener('pointerdown',e=>{e.preventDefault(); onDown(e.clientX,e.clientY);},{passive:false});
window.addEventListener('pointermove',e=>onMove(e.clientX));
window.addEventListener('pointerup',e=>onUp(e.clientX,e.clientY));
window.addEventListener('pointercancel',()=>{drag=null; pressId=null;});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.addEventListener('keydown',e=>{
  if(state!=='play'){
    if(e.key==='1') setDifficulty('normal');
    if(e.key==='2') setDifficulty('hard');
    if(e.key==='3') setDifficulty('crazy');
  }
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.right=true;
  if(e.key===' '||e.key==='Enter'){if(state!=='play') onDown(0,0);}
  if(state==='play'&&e.key==='1') G.tx=laneCenter(0);
  if(state==='play'&&e.key==='2') G.tx=laneCenter(1);
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.right=false;
});
document.addEventListener('visibilitychange',()=>{last=performance.now();});

let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function combatSnapshot(id,wave){
  const m=modeBy(id),w=wave,old=oldCount(w);
  const count=hordeBudget(m,w);
  const gap=spawnGap(m,w);
  const hp=(1+w*1.1)*Math.pow(1.16,w)*m.hp;
  return {label:m.label,count,oldCount:old,gap,hp,dmg:Math.round(6*m.dmg),speed:(58+w*3)*m.speed,
    bossHp:Math.round((55*w+w*w*6)*Math.pow(1.1,w)*m.bossHp),bossDmg:Math.round(60*m.bossDmg),
    bossSp:(22+w*0.8)*m.bossSp,doubleAfter:m.doubleAfter,doubleP:m.doubleP,delay:m.delay,
    dpsNeed:hp/gap};
}
function clientFromGame(x,y){return {x:offX()+x*scale,y:y*scale};}
window.__lane={
  get state(){return state;},
  get G(){return G;},
  get difficulty(){return selected;},
  get runDifficulty(){return G?G.diffId:null;},
  get bests(){return {normal:bests.normal,hard:bests.hard,crazy:bests.crazy};},
  get buttons(){return buttonRects();},
  get defenseY(){return pY();},
  geom(){return chromeGeom();},
  setDifficulty(id){return setDifficulty(id);},
  snapshot(id,wave){return combatSnapshot(id,wave);},
  rollPower(){return pickPowerId();},
  tap(x,y){const c=clientFromGame(x,y); onDown(c.x,c.y); onUp(c.x,c.y);},
  step(s,draw){const n=Math.max(0,Math.round(s*60)); for(let i=0;i<n;i++){update(1/60); if(draw!==false) render();} if(draw===false) render();}
};
})();
</script>
</body>
</html>
