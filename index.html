<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lane Clash">
<meta name="theme-color" content="#0b0f1e">
<title>Lane Clash</title>
<link id="appleIcon" rel="apple-touch-icon" href="">
<link id="manifestLink" rel="manifest" href="">
<style>
html,body{margin:0;padding:0;height:100%;background:#0b0f1e;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=400;let H=760,scale=1,dpr=1;
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,3);
  scale=vw/W;H=Math.max(560,vh/scale);
  if(H*scale>vh){scale=vh/H;}
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
}
window.addEventListener('resize',resize);resize();
// offset to center horizontally if letterboxed
function offX(){return (window.innerWidth-W*scale)/2;}

// ---------- icon + manifest (generated at runtime, no external files) ----------
try{
  const ic=document.createElement('canvas');ic.width=ic.height=192;const g=ic.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,192);gr.addColorStop(0,'#1d2b64');gr.addColorStop(1,'#0b0f1e');
  g.fillStyle=gr;g.fillRect(0,0,192,192);
  g.fillStyle='#2ecc71';g.fillRect(16,16,76,160);g.fillStyle='#e74c3c';g.fillRect(100,16,76,160);
  g.fillStyle='#fff';g.beginPath();g.moveTo(96,120);g.lineTo(76,165);g.lineTo(116,165);g.closePath();g.fill();
  g.font='bold 40px sans-serif';g.textAlign='center';g.fillText('+',54,80);g.fillText('☠',138,80);
  const url=ic.toDataURL('image/png');
  document.getElementById('appleIcon').href=url;
  const man={name:'Lane Clash',short_name:'Lane Clash',display:'standalone',orientation:'portrait',background_color:'#0b0f1e',theme_color:'#0b0f1e',start_url:location.href.split('#')[0],icons:[{src:url,sizes:'192x192',type:'image/png'}]};
  document.getElementById('manifestLink').href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
}catch(e){}

// ---------- helpers ----------
const rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1)), clamp=(v,a,b)=>v<a?a:v>b?b:v;
let BEST=0;try{BEST=+localStorage.getItem('laneClashBest')||0;}catch(e){}
function saveBest(){try{localStorage.setItem('laneClashBest',BEST);}catch(e){}}

// ---------- audio (tiny synth, optional) ----------
let AC=null;
function beep(f,d,type,vol){if(!AC)return;try{const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'square';o.frequency.value=f;gn.gain.value=vol||0.03;gn.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}

// ---------- game state ----------
const LANE_W=W/2;
let state='menu',G=null,shake=0,flash=0,t=0;
function laneCenter(i){return LANE_W*i+LANE_W/2;}
function newGame(){
  G={hp:100,maxHp:100,score:0,kills:0,wave:0,
     rate:3,dmg:1,multi:1,squad:0,
     px:laneCenter(0),tx:laneCenter(0),
     upLane:0, // 0 = left lane has upgrades, right has horde
     bullets:[],enemies:[],gates:[],parts:[],texts:[],
     fireT:0,gateT:1.2,spawnLeft:0,spawnT:0,waveT:0,bannerT:0,banner:'',bannerSub:'',
     bossAlive:false,over:false};
  startWave();
}
function hordeLane(){return 1-G.upLane;}
function startWave(){
  G.wave++;
  const w=G.wave;
  let sub='';
  if(w>1&&w%3===1){G.upLane=1-G.upLane;sub='LANES SWAPPED!';beep(300,0.4,'sawtooth',0.04);}
  G.spawnLeft=6+Math.floor(w*2.5);
  G.spawnT=1.5;
  if(w%5===0){spawnBoss();sub='⚠ BOSS INCOMING ⚠';G.spawnLeft=Math.floor(G.spawnLeft*0.5);}
  G.banner='WAVE '+w;G.bannerSub=sub;G.bannerT=2.2;
}
function spawnEnemy(){
  const w=G.wave,l=hordeLane();
  const big=Math.random()<Math.min(0.08+w*0.02,0.35);
  const hp=Math.round((1+w*1.1)*Math.pow(1.16,w)*(big?3.5:1)*(0.8+Math.random()*0.4));
  G.enemies.push({x:laneCenter(l)+rand(-LANE_W/2+22,LANE_W/2-22),y:-20,r:big?19:12,hp,maxHp:hp,
    sp:(big?40:58)+w*3+rand(0,15),dmg:big?14:6,fl:0,boss:false,wob:rand(0,6),pts:big?30:10});
}
function spawnBoss(){
  const w=G.wave,l=hordeLane(),hp=Math.round((55*w+w*w*6)*Math.pow(1.1,w));
  G.enemies.push({x:laneCenter(l),y:-60,r:42,hp,maxHp:hp,sp:22+w*0.8,dmg:60,fl:0,boss:true,wob:0,pts:500+w*50});
  G.bossAlive=true;
}
const GATE_TYPES=[
  {k:'rate',label:v=>(v>=0?'+':'')+v+' FIRE RATE',max:5},
  {k:'dmg',label:v=>(v>=0?'+':'')+v+' DAMAGE',max:4},
  {k:'multi',label:v=>(v>=0?'+':'')+v+' MULTISHOT',max:2},
  {k:'squad',label:v=>(v>=0?'+':'')+v+' SQUAD',max:3},
  {k:'heal',label:v=>(v>=0?'+':'')+(v*10)+' HP',max:5},
];
function spawnGate(){
  const w=G.wave;
  let type=GATE_TYPES[randi(0,GATE_TYPES.length-1)];
  if(G.multi>=7&&type.k==='multi')type=GATE_TYPES[0];
  if(G.squad>=10&&type.k==='squad')type=GATE_TYPES[1];
  const risky=Math.random()<Math.min(0.25+w*0.03,0.55);
  let v=risky?-randi(1,type.k==='heal'?3:2):randi(1,type.k==='heal'?3:2);
  // hits needed to raise value by 1
  const need=Math.round(5+w*1.5);
  G.gates.push({x:laneCenter(G.upLane),y:-40,w:LANE_W-24,h:52,type,v,prog:0,need,sp:85+w*2,fl:0,lane:G.upLane});
}
function applyGate(g){
  const v=g.v,k=g.type.k;
  if(k==='rate')G.rate=clamp(G.rate+v*0.8,1,22);
  if(k==='dmg')G.dmg=clamp(G.dmg+v,1,50);
  if(k==='multi')G.multi=clamp(G.multi+v,1,7);
  if(k==='squad')G.squad=clamp(G.squad+v,0,10);
  if(k==='heal')G.hp=clamp(G.hp+v*10,0,G.maxHp);
  const good=v>=0;
  addText(g.x,g.y,g.type.label(v),good?'#7dffb0':'#ff6b6b',22);
  burst(g.x,g.y,good?'#2ecc71':'#e74c3c',22,220);
  if(good)beep(660,0.15,'triangle',0.05);else{beep(140,0.3,'sawtooth',0.05);shake=8;}
  if(G.hp<=0)gameOver();
}
// shooter positions relative to player
function shooters(){
  const arr=[{x:G.px,y:pY()}];
  for(let i=0;i<G.squad;i++){
    const ring=Math.floor(i/2)+1,side=i%2?1:-1;
    arr.push({x:G.px+side*ring*20,y:pY()+12+((ring%2)*8)});
  }
  return arr;
}
function pY(){return H-110;}
function fire(){
  const ss=shooters(),m=G.multi;
  for(const s of ss){
    for(let j=0;j<m;j++){
      const off=(j-(m-1)/2);
      G.bullets.push({x:s.x+off*5,y:s.y-14,vx:off*38,vy:-720,d:G.dmg});
    }
  }
  if(Math.random()<0.3)beep(900+Math.random()*200,0.04,'square',0.012);
}
function burst(x,y,c,n,sp){if(G.parts.length>600)n=Math.min(n,4);for(let i=0;i<n;i++){const a=rand(0,6.283),s=rand(sp*0.2,sp);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.3,0.7),c,r:rand(1.5,3.5)});}}
function addText(x,y,s,c,sz){if(G.texts.length>80)G.texts.shift();G.texts.push({x,y,s,c,sz:sz||16,life:1});}
function gameOver(){
  if(state!=='play')return;
  state='over';G.over=true;overT=0;
  if(G.score>BEST){BEST=G.score;saveBest();G.newBest=true;}
  burst(G.px,pY(),'#ffcc00',60,350);shake=18;beep(90,0.8,'sawtooth',0.06);
}
let overT=0;

// ---------- update ----------
function update(dt){
  t+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*40);
  if(flash>0)flash=Math.max(0,flash-dt*3);
  if(!G)return;
  // particles/texts always
  for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy*=0.94;p.life-=dt;}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const tx of G.texts){tx.y-=40*dt;tx.life-=dt*0.9;}
  G.texts=G.texts.filter(x=>x.life>0);
  if(state!=='play'){overT+=dt;return;}
  // keyboard
  if(keys.left)G.tx-=420*dt;if(keys.right)G.tx+=420*dt;
  G.tx=clamp(G.tx,18,W-18);
  G.px+=(G.tx-G.px)*Math.min(1,dt*14);
  // fire
  G.fireT-=dt;
  if(G.fireT<=0){fire();G.fireT+=1/G.rate;if(G.fireT<0)G.fireT=0;}
  // bullets
  for(const b of G.bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;}
  // spawns
  if(G.bannerT>0)G.bannerT-=dt;
  G.spawnT-=dt;
  if(G.spawnLeft>0&&G.spawnT<=0){spawnEnemy();G.spawnLeft--;G.spawnT=Math.max(0.28,1.1-G.wave*0.05)*rand(0.6,1.3);
    if(G.wave>4&&Math.random()<0.25&&G.spawnLeft>0){spawnEnemy();G.spawnLeft--;}}
  G.gateT-=dt;
  if(G.gateT<=0){spawnGate();G.gateT=rand(2.0,2.8);}
  // enemies
  const line=pY()+10;
  for(const e of G.enemies){
    e.y+=e.sp*dt;e.wob+=dt*4;e.x+=Math.sin(e.wob)*(e.boss?10:18)*dt;
    const l=e.x<LANE_W?0:1;const lo=l*LANE_W+e.r,hi=(l+1)*LANE_W-e.r;e.x=clamp(e.x,lo,hi);
    if(e.fl>0)e.fl-=dt*6;
    if(e.y+e.r>=line){
      e.dead=true;G.hp-=e.dmg;shake=Math.max(shake,e.boss?20:6);flash=Math.max(flash,e.boss?1:0.5);
      burst(e.x,line,'#ff3355',e.boss?60:14,260);addText(e.x,line-20,'-'+e.dmg+' HP','#ff4d6d',20);
      beep(110,0.2,'sawtooth',0.05);
      if(e.boss)G.bossAlive=false;
      if(G.hp<=0){G.hp=0;gameOver();}
    }
  }
  // gates
  for(const g of G.gates){
    g.y+=g.sp*dt;if(g.fl>0)g.fl-=dt*6;
    // collect
    if(!g.done&&g.y+g.h/2>=pY()-14&&g.y-g.h/2<=pY()+10){
      if(Math.abs(G.px-g.x)<g.w/2+6){g.done=true;applyGate(g);}
    }
    if(g.y-g.h/2>H)g.done=true;
  }
  // collisions
  for(const b of G.bullets){
    if(b.dead)continue;
    for(const e of G.enemies){
      if(e.dead)continue;
      const dx=b.x-e.x,dy=b.y-e.y;
      if(dx*dx+dy*dy<(e.r+3)*(e.r+3)){
        b.dead=true;e.hp-=b.d;e.fl=1;
        if(Math.random()<0.4)G.parts.push({x:b.x,y:b.y,vx:rand(-80,80),vy:rand(-40,60),life:0.25,c:'#fff',r:2});
        if(e.hp<=0){e.dead=true;G.kills++;G.score+=e.pts;burst(e.x,e.y,e.boss?'#ffcc00':'#ff7a45',e.boss?80:12,e.boss?400:200);
          addText(e.x,e.y,'+'+e.pts,e.boss?'#ffe066':'#ffd8a8',e.boss?28:14);beep(e.boss?200:420,e.boss?0.6:0.06,'square',0.03);
          if(e.boss){G.bossAlive=false;shake=16;G.hp=clamp(G.hp+25,0,G.maxHp);addText(W/2,H/2,'BOSS DOWN! +25 HP','#7dffb0',26);}}
        break;
      }
    }
    if(b.dead)continue;
    for(const g of G.gates){
      if(g.done)continue;
      if(Math.abs(b.x-g.x)<g.w/2&&Math.abs(b.y-g.y)<g.h/2){
        b.dead=true;g.fl=1;
        if(g.v<g.type.max){g.prog+=1;
          if(g.prog>=g.need){g.prog=0;g.v+=1;if(G.texts.length<60)addText(g.x+rand(-30,30),g.y-20,'+1','#9fffc9',14);beep(1200,0.05,'triangle',0.02);}}
        else g.prog=g.need;
        break;
      }
    }
  }
  G.bullets=G.bullets.filter(b=>!b.dead&&b.y>-30&&b.x>-20&&b.x<W+20);
  G.enemies=G.enemies.filter(e=>!e.dead);
  G.gates=G.gates.filter(g=>!g.done);
  // wave done?
  if(G.spawnLeft<=0&&G.enemies.length===0&&state==='play'){G.score+=G.wave*25;startWave();}
}

// ---------- render ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawBG(){
  const up=G?G.upLane:0;
  for(let l=0;l<2;l++){
    const isUp=l===up;
    const gr=ctx.createLinearGradient(0,0,0,H);
    if(isUp){gr.addColorStop(0,'#0f3d2e');gr.addColorStop(1,'#123a52');}else{gr.addColorStop(0,'#3d0f1e');gr.addColorStop(1,'#2a1240');}
    ctx.fillStyle=gr;ctx.fillRect(l*LANE_W,0,LANE_W,H);
    // moving stripes
    ctx.fillStyle=isUp?'rgba(46,204,113,0.07)':'rgba(231,76,60,0.08)';
    const off=(t*80)%60;
    for(let y=-60+off;y<H;y+=60)ctx.fillRect(l*LANE_W+8,y,LANE_W-16,24);
    ctx.font='bold 13px system-ui,sans-serif';ctx.textAlign='center';
    ctx.fillStyle=isUp?'rgba(125,255,176,0.55)':'rgba(255,120,120,0.55)';
    ctx.fillText(isUp?'⬆ UPGRADES':'☠ HORDE',laneCenter(l),H-18);
  }
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(LANE_W-1.5,0,3,H);
  // defense line
  if(G){ctx.strokeStyle='rgba(255,80,100,0.35)';ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(0,pY()+10);ctx.lineTo(W,pY()+10);ctx.stroke();ctx.setLineDash([]);}
}
function drawSoldier(x,y,main){
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(x,y+12,10,4,0,0,6.283);ctx.fill();
  ctx.fillStyle=main?'#4dabf7':'#74c0fc';rr(x-8,y-6,16,18,5);ctx.fill();
  ctx.fillStyle='#ffe0bd';ctx.beginPath();ctx.arc(x,y-10,6,0,6.283);ctx.fill();
  ctx.fillStyle=main?'#1c7ed6':'#339af0';ctx.fillRect(x-7,y-17,14,5);
  ctx.fillStyle='#ced4da';ctx.fillRect(x+3,y-20,4,14);
}
function drawEnemy(e){
  const x=e.x,y=e.y,r=e.r;
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(x,y+r*0.9,r*0.9,r*0.35,0,0,6.283);ctx.fill();
  ctx.fillStyle=e.fl>0?'#fff':(e.boss?'#9c36b5':(r>15?'#c92a2a':'#e8590c'));
  ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();
  // horns/eyes
  ctx.fillStyle=e.fl>0?'#fff':'#2b0a0a';
  ctx.beginPath();ctx.moveTo(x-r*0.7,y-r*0.5);ctx.lineTo(x-r*0.9,y-r*1.3);ctx.lineTo(x-r*0.3,y-r*0.8);ctx.fill();
  ctx.beginPath();ctx.moveTo(x+r*0.7,y-r*0.5);ctx.lineTo(x+r*0.9,y-r*1.3);ctx.lineTo(x+r*0.3,y-r*0.8);ctx.fill();
  ctx.fillStyle='#ffec99';ctx.beginPath();ctx.arc(x-r*0.35,y-r*0.1,r*0.18,0,6.283);ctx.arc(x+r*0.35,y-r*0.1,r*0.18,0,6.283);ctx.fill();
  if(e.hp<e.maxHp||e.boss){
    const bw=e.boss?90:r*2;ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(x-bw/2,y-r-12,bw,5);
    ctx.fillStyle=e.boss?'#da77f2':'#ff6b6b';ctx.fillRect(x-bw/2,y-r-12,bw*Math.max(0,e.hp/e.maxHp),5);
  }
  if(e.boss){ctx.fillStyle='#fff';ctx.font='bold 14px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('BOSS '+Math.ceil(e.hp),x,y-r-17);}
}
function drawGate(g){
  const good=g.v>=0,x=g.x-g.w/2,y=g.y-g.h/2;
  ctx.fillStyle=good?'rgba(46,204,113,0.35)':'rgba(231,76,60,0.38)';
  if(g.fl>0)ctx.fillStyle=good?'rgba(150,255,200,0.6)':'rgba(255,170,170,0.6)';
  rr(x,y,g.w,g.h,10);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=good?'#51cf66':'#ff6b6b';ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='bold 19px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(g.type.label(g.v),g.x,g.y-3);ctx.textBaseline='alphabetic';
  // progress bar to next +1
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(x+10,y+g.h-9,g.w-20,4);
  ctx.fillStyle='#ffe066';ctx.fillRect(x+10,y+g.h-9,(g.w-20)*(g.prog/g.need),4);
}
function drawHUD(){
  // top bar
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,58);
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 18px system-ui,sans-serif';
  ctx.fillText('WAVE '+G.wave,12,24);
  ctx.textAlign='right';ctx.fillText(G.score.toLocaleString(),W-12,24);
  ctx.font='11px system-ui,sans-serif';ctx.fillStyle='#adb5bd';ctx.fillText('BEST '+Math.max(BEST,G.score).toLocaleString(),W-12,40);
  // hp bar
  const hw=180,hx=W/2-hw/2;ctx.fillStyle='#343a40';rr(hx,10,hw,14,7);ctx.fill();
  const f=G.hp/G.maxHp;ctx.fillStyle=f>0.5?'#51cf66':f>0.25?'#fcc419':'#ff6b6b';rr(hx,10,Math.max(0.01,hw*f),14,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 11px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('HP '+Math.ceil(G.hp),W/2,21);
  // stats
  ctx.font='bold 12px system-ui,sans-serif';ctx.fillStyle='#e9ecef';
  const st='🔥'+G.rate.toFixed(1)+'/s   💥'+G.dmg+'   🔱x'+G.multi+'   👥'+(G.squad+1);
  ctx.fillText(st,W/2,46);
}
function center(s,y,sz,c,weight){ctx.font=(weight||'bold')+' '+sz+'px system-ui,sans-serif';ctx.fillStyle=c||'#fff';ctx.textAlign='center';ctx.fillText(s,W/2,y);}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0b0f1e';ctx.fillRect(0,0,cv.width,cv.height);
  const sx=shake?rand(-shake,shake)*0.5:0,sy=shake?rand(-shake,shake)*0.5:0;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,(offX()+sx*scale)*dpr,sy*scale*dpr);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  drawBG();
  if(G){
    for(const g of G.gates)drawGate(g);
    for(const e of G.enemies)drawEnemy(e);
    ctx.fillStyle='#ffe066';
    for(const b of G.bullets){ctx.fillRect(b.x-1.5,b.y-6,3,10);}
    if(state!=='over'){const ss=shooters();for(let i=ss.length-1;i>=0;i--)drawSoldier(ss[i].x,ss[i].y,i===0);}
    for(const p of G.parts){ctx.globalAlpha=Math.max(0,p.life*1.6);ctx.fillStyle=p.c;ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);}
    ctx.globalAlpha=1;
    for(const tx of G.texts){ctx.globalAlpha=Math.max(0,Math.min(1,tx.life*1.5));ctx.font='bold '+tx.sz+'px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.strokeText(tx.s,tx.x,tx.y);ctx.fillStyle=tx.c;ctx.fillText(tx.s,tx.x,tx.y);}
    ctx.globalAlpha=1;
    drawHUD();
    if(G.bannerT>0&&state==='play'){
      const a=Math.min(1,G.bannerT*2);ctx.globalAlpha=a;
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,H*0.32,W,G.bannerSub?90:60);
      center(G.banner,H*0.32+42,34,'#fff');
      if(G.bannerSub)center(G.bannerSub,H*0.32+74,18,G.bannerSub.includes('BOSS')?'#ff8787':'#ffe066');
      ctx.globalAlpha=1;
    }
  }
  if(flash>0){ctx.fillStyle='rgba(255,0,40,'+(flash*0.25)+')';ctx.fillRect(0,0,W,H);}
  if(state==='menu')drawMenu();
  if(state==='over')drawOver();
  ctx.restore();
}
function drawMenu(){
  ctx.fillStyle='rgba(5,8,20,0.78)';ctx.fillRect(0,0,W,H);
  const y0=H*0.16;
  center('LANE',y0,58,'#51cf66','900');center('CLASH',y0+56,58,'#ff6b6b','900');
  const lines=['HOW TO PLAY',
    '👆 Drag or tap left/right to switch lanes',
    '🔫 Your squad fires automatically',
    '🟩 Upgrade lane: walk through gates',
    '   to power up. Shoot a gate to raise',
    '   its number. Red gates hurt you!',
    '🟥 Horde lane: monsters that reach',
    '   the red line cost you HP',
    '⚖️ Balance grabbing upgrades with',
    '   holding back the horde',
    '🔄 Lanes swap every few waves',
    '👹 Boss every 5 waves'];
  let y=y0+110;
  for(let i=0;i<lines.length;i++){
    if(i===0){center(lines[i],y,18,'#ffe066');y+=30;continue;}
    ctx.font='15px system-ui,sans-serif';ctx.fillStyle='#e9ecef';ctx.textAlign='left';ctx.fillText(lines[i],40,y);y+=23;
  }
  const pulse=0.6+0.4*Math.sin(t*4);ctx.globalAlpha=pulse;center('TAP TO START',Math.min(H-60,y+50),26,'#fff');ctx.globalAlpha=1;
  if(BEST>0)center('Best: '+BEST.toLocaleString(),Math.min(H-28,y+82),15,'#adb5bd','normal');
}
function drawOver(){
  ctx.fillStyle='rgba(5,8,20,0.8)';ctx.fillRect(0,0,W,H);
  center('OVERRUN!',H*0.28,52,'#ff6b6b','900');
  center('Wave '+G.wave+'  •  '+G.kills+' kills',H*0.28+46,18,'#ced4da','normal');
  center(G.score.toLocaleString(),H*0.28+120,56,'#fff','900');
  center(G.newBest?'★ NEW BEST! ★':'Best: '+BEST.toLocaleString(),H*0.28+156,20,G.newBest?'#ffe066':'#adb5bd');
  if(overT>0.8){const pulse=0.6+0.4*Math.sin(t*4);ctx.globalAlpha=pulse;center('TAP TO PLAY AGAIN',H*0.28+240,24,'#fff');ctx.globalAlpha=1;}
}

// ---------- input ----------
const keys={left:false,right:false};
function toGameX(clientX){return (clientX-offX())/scale;}
let drag=null;
function onDown(cx){
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  if(state==='menu'){state='play';newGame();return;}
  if(state==='over'){if(overT>0.8){state='play';newGame();}return;}
  drag={x0:cx,gx0:G.tx,moved:false,t0:performance.now()};
}
function onMove(cx){
  if(!drag||state!=='play')return;
  const dx=(cx-drag.x0)/scale;
  if(Math.abs(dx)>6)drag.moved=true;
  if(drag.moved)G.tx=clamp(drag.gx0+dx*1.4,18,W-18);
}
function onUp(cx){
  if(!drag||state!=='play'){drag=null;return;}
  if(!drag.moved){const gx=toGameX(cx);G.tx=laneCenter(gx<LANE_W?0:1);}
  drag=null;
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();onDown(e.clientX);},{passive:false});
window.addEventListener('pointermove',e=>onMove(e.clientX));
window.addEventListener('pointerup',e=>onUp(e.clientX));
window.addEventListener('pointercancel',()=>{drag=null;});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;
  if(e.key===' '||e.key==='Enter'){if(state!=='play')onDown(0);}
  if(state==='play'&&(e.key==='1'))G.tx=laneCenter(0);
  if(state==='play'&&(e.key==='2'))G.tx=laneCenter(1);
});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;
});
document.addEventListener('visibilitychange',()=>{last=performance.now();});

// ---------- loop ----------
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(dt<0)dt=0;
  update(dt);render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// tiny debug hook for automated tests
window.__lane={get state(){return state;},get G(){return G;},step:(s)=>{for(let i=0;i<s*60;i++)update(1/60);render();}};
})();
</script>
